<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PKD Outbreak Field Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: field-reference app. Visual first (pathway, time clock, schedules), guideline text one tap below. Phone = one column + bottom tabs; >=900px = disease rail + detail pane. */
:root{
  --bg:#f1f4f3; --surface:#ffffff; --surface-2:#e8edeb; --ink:#14201d; --muted:#53625d; --line:#d3dcd9;
  --accent:#1c5577; --accent-ink:#ffffff; --accent-soft:#deebf3;
  --my:#14694a; --my-bg:#ddf0e5;
  --law:#34465a; --law-bg:#e3e9ef;
  --my2:#2b6457; --my2-bg:#e6f1ec;
  --state:#0d6274; --state-bg:#daeff3;
  --intl:#57458f; --intl-bg:#ebe7f6;
  --generic:#4f5d59; --generic-bg:#e8ecea;
  --pending:#865300; --pending-bg:#fbedcf;
  --warn:#972d1b; --warn-bg:#fae4de;
  /* chart roles (validated: blue/orange pair; issue hues red/violet/amber) */
  --c1:#2a78d6; --c1-wash:rgba(42,120,214,.22);
  --c2:#eb6834; --c2-wash:rgba(235,104,52,.22);
  --grid:#e3e9e7; --axis:#b6c2be; --past:#a6b0ad;
  --i-conf:#e34948; --i-gap:#6250d6; --i-old:#eda100; --i-minor:#b5bdba;
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1312; --surface:#141c1a; --surface-2:#1b2523; --ink:#e3eae7; --muted:#9caea8; --line:#283431;
    --accent:#88c0e4; --accent-ink:#0a1822; --accent-soft:#16293a;
    --my:#78d3a6; --my-bg:#10281d;
    --law:#bccad9; --law-bg:#1c2632;
    --my2:#93d1bf; --my2-bg:#122723;
    --state:#80d1e1; --state-bg:#0e2930;
    --intl:#bdaff0; --intl-bg:#231e39;
    --generic:#aab7b3; --generic-bg:#1e2725;
    --pending:#f0c46c; --pending-bg:#32270f;
    --warn:#ff9f8d; --warn-bg:#391913;
    --c1:#3987e5; --c1-wash:rgba(57,135,229,.28);
    --c2:#d95926; --c2-wash:rgba(217,89,38,.30);
    --grid:#222d2b; --axis:#3e4b48; --past:#5e6a66;
    --i-conf:#e66767; --i-gap:#9085e9; --i-old:#c98500; --i-minor:#56625e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1312; --surface:#141c1a; --surface-2:#1b2523; --ink:#e3eae7; --muted:#9caea8; --line:#283431;
  --accent:#88c0e4; --accent-ink:#0a1822; --accent-soft:#16293a;
  --my:#78d3a6; --my-bg:#10281d;
  --law:#bccad9; --law-bg:#1c2632;
  --my2:#93d1bf; --my2-bg:#122723;
  --state:#80d1e1; --state-bg:#0e2930;
  --intl:#bdaff0; --intl-bg:#231e39;
  --generic:#aab7b3; --generic-bg:#1e2725;
  --pending:#f0c46c; --pending-bg:#32270f;
  --warn:#ff9f8d; --warn-bg:#391913;
  --c1:#3987e5; --c1-wash:rgba(57,135,229,.28);
  --c2:#d95926; --c2-wash:rgba(217,89,38,.30);
  --grid:#222d2b; --axis:#3e4b48; --past:#5e6a66;
  --i-conf:#e66767; --i-gap:#9085e9; --i-old:#c98500; --i-minor:#56625e;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--font-mono)}
.ic{width:20px;height:20px;flex:none}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0;flex:0 1 auto}
.brand-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:23px;line-height:1.05;letter-spacing:.01em;margin:0;text-wrap:balance}
.brand small{color:var(--muted);font-size:12px;line-height:1.3}
.tag{font-family:var(--font-mono);font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--pending);background:var(--pending-bg);padding:2px 6px;border-radius:4px;white-space:nowrap}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:0 10px;min-width:0}
.search:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:9px 0;outline:none}
.search input::placeholder{color:var(--muted)}
.clear-q{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:6px;border-radius:4px}
nav.tabs-top{display:none;gap:2px}
.tabbtn{font-weight:600;font-size:14px;line-height:1;color:var(--muted);background:transparent;border:0;padding:10px 12px;border-radius:6px;cursor:pointer}
.tabbtn:hover{color:var(--ink)}
.tabbtn[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs-bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs-bottom .tabbtn{border-radius:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px}
nav.tabs-bottom .tabbtn svg{width:20px;height:20px}
nav.tabs-bottom .tabbtn[aria-current="page"]{background:transparent}
@media (max-width:599px){
  .brand small{display:none}
  .brand h1{font-size:21px}
  .top-inner{padding-block:8px;gap:8px}
  .search input{padding:8px 0}
}
main{max-width:1280px;margin:0 auto;padding-block:16px 104px}
.layout{display:block}
.rail{display:block}
.pane{min-width:0;container-type:inline-size}
@media (min-width:900px){
  nav.tabs-top{display:flex}
  nav.tabs-bottom{display:none}
  main{padding-block:20px 48px}
  .layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
  .rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
  .back{display:none!important}
}
@media (max-width:899px){
  .layout.show-detail .rail{display:none}
  .layout:not(.show-detail) .pane{display:none}
}

/* Status: dots and chips */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;vertical-align:1px}
.dot-my{background:var(--my)}.dot-law{background:var(--law)}.dot-my2{background:var(--my2)}.dot-state{background:var(--state)}.dot-intl{background:var(--intl)}.dot-generic{background:var(--generic)}.dot-pending{background:transparent;box-shadow:inset 0 0 0 1.5px var(--pending)}.dot-partial{background:linear-gradient(90deg,var(--my) 50%,transparent 50%);box-shadow:inset 0 0 0 1.5px var(--my)}.dot-mixed{background:linear-gradient(90deg,var(--my) 50%,var(--intl) 50%)}
.chip{display:inline-flex;align-items:center;font-family:var(--font-mono);font-weight:500;font-size:10.5px;line-height:1.25;text-transform:uppercase;letter-spacing:.06em;padding:3px 6px;border-radius:4px;white-space:nowrap}
.st-my{color:var(--my);background:var(--my-bg)}
.st-law{color:var(--law);background:var(--law-bg)}
.st-my2{color:var(--my2);background:var(--my2-bg);box-shadow:inset 0 0 0 1px var(--my2)}
.st-state{color:var(--state);background:var(--state-bg)}
.st-intl{color:var(--intl);background:var(--intl-bg)}
.st-generic{color:var(--generic);background:var(--generic-bg)}
.st-pending{color:var(--pending);background:var(--pending-bg)}
.st-partial{color:var(--pending);background:var(--pending-bg);box-shadow:inset 0 0 0 1px var(--pending)}
.st-mixed{color:var(--my);background:var(--my-bg);box-shadow:inset 0 0 0 1px var(--intl)}
.iss-conflict,.iss-error{color:var(--warn);background:var(--warn-bg)}
.iss-outdated{color:var(--pending);background:var(--pending-bg)}
.iss-gap{color:var(--intl);background:var(--intl-bg)}
.iss-minor{color:var(--generic);background:var(--generic-bg)}
.key{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:5px}

/* Disease list */
.group{margin:0 0 18px}
.group h2{font-family:var(--font-mono);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 6px}
.dlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.drow{width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;min-width:0}
.drow:hover{border-color:var(--accent)}
.drow[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.drow .nm{font-weight:600;font-size:15px;line-height:1.3;min-width:0}
.drow .bm{color:var(--muted);font-size:12.5px;line-height:1.35;grid-column:1;min-width:0}
.drow .np{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.npill{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:11.5px;line-height:1.2;padding:3px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.npill .ic{width:13px;height:13px}
.npill.urgent{background:var(--warn-bg);color:var(--warn)}
.npill.pend{background:var(--pending-bg);color:var(--pending)}
.bar{display:inline-flex;gap:2px}
.bar i{display:block;width:6px;height:6px;border-radius:1px;background:transparent;box-shadow:inset 0 0 0 1px var(--axis)}
.bar i.on{background:var(--my);box-shadow:none}
.bar i.mid{background:var(--intl);box-shadow:none}
.listkey{margin:0 0 14px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:14px;color:var(--muted)}

/* Disease detail */
.back{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;color:var(--accent);font-weight:600;padding:4px 0;margin:0 0 10px;cursor:pointer}
.dhead{margin:0 0 12px}
.dhead h2{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;margin:0;text-wrap:balance}
.dhead .sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.glance{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}
@container (max-width:560px){.glance{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 9px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;min-width:0}
.gl:hover{border-color:var(--accent)}
.gl .ic{width:20px;height:20px;color:var(--accent);grid-row:span 2;margin-top:1px}
.gl .k{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.gl .v{font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.gl.pend{border-style:dashed}
.gl.pend .v{color:var(--pending)}
.gl.pend .ic{color:var(--pending)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:7px 11px;font-size:13.5px;font-weight:600;cursor:pointer}
.btn .ic{width:16px;height:16px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{color:var(--accent-ink);filter:brightness(1.08)}
.vizgrid{display:grid;gap:12px;margin:0 0 12px}
.vizgrid .col{display:grid;gap:12px;align-content:start;min-width:0}
@container (min-width:800px){.vizgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;min-width:0;margin:0}
.panel > h3{font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1.15;margin:0;text-wrap:balance}
.panel > .sub{color:var(--muted);font-size:12.5px;margin:1px 0 10px}
.panel figcaption,.panel .foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px}
.panel .foot a{color:var(--muted)}

/* Response pathway */
.flow{list-style:none;margin:0;padding:0}
.flow > li{position:relative;padding:0 0 16px 38px}
.flow > li:last-child{padding-bottom:0}
.flow > li::before{content:"";position:absolute;left:14px;top:30px;bottom:6px;width:2px;background:var(--axis)}
.flow > li::after{content:"";position:absolute;left:10px;bottom:1px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid var(--axis)}
.flow > li:last-child::before,.flow > li:last-child::after{display:none}
.fm{position:absolute;left:1px;top:3px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--accent-soft);color:var(--accent)}
.fm .ic{width:16px;height:16px}
.fm.dia{background:transparent}
.fm.dia::before{content:"";position:absolute;inset:4px;transform:rotate(45deg);background:var(--accent);border-radius:3px}
.fm.dia b{position:relative;color:var(--accent-ink);font-family:var(--font-mono);font-size:13px;line-height:1}
.fm.alert{background:var(--warn-bg);color:var(--warn)}
.fm.done{background:var(--my-bg);color:var(--my)}
.fm.pend{background:var(--pending-bg);color:var(--pending)}
.fn{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px 8px;cursor:pointer;min-width:0;color:var(--ink)}
.fn:hover{border-color:var(--accent)}
.fn .fk{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fn .fv{display:block;font-weight:600;font-size:14px;line-height:1.35;margin-top:1px}
.fn .fr{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.fn.alert{background:var(--warn-bg);border-color:transparent}
.fn.alert .fk{color:var(--warn)}
.fn.done{background:var(--my-bg);border-color:transparent}
.fn.done .fk{color:var(--my)}
.fn.pend{border-style:dashed;background:transparent}
.fn.pend .fv,.fn .pendtxt{color:var(--pending)}
.you{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;line-height:1.5}
.fl{display:grid;gap:3px;margin-top:3px}
.fl > span{display:grid;grid-template-columns:10px minmax(0,1fr);gap:7px;align-items:baseline;font-size:13.5px;line-height:1.35}
.fl > span .dot{width:7px;height:7px}
.cls{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cls > span{font-size:12.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--surface-2);line-height:1.4}
.cls > span:last-child{background:var(--accent-soft);color:var(--accent)}
.fos{display:grid;gap:5px;margin-top:6px}
.fo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:13px;line-height:1.35}
.fb{font-family:var(--font-mono);font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:4px;white-space:nowrap;margin-top:1px}
.fb.no{background:var(--surface-2);color:var(--muted)}
.fb.yes{background:var(--warn-bg);color:var(--warn)}
.fb.amber{background:var(--pending-bg);color:var(--pending)}
.fb.ok{background:var(--my-bg);color:var(--my)}
.fo.br{grid-template-columns:minmax(0,1fr);gap:3px}
.fo.br .fb{white-space:normal;justify-self:start;line-height:1.35}
.flag{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-body);font-size:11.5px;text-transform:none;letter-spacing:0;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:1px 6px 1px 4px;margin-top:5px}
.flag .ic{width:13px;height:13px}
.fn .flag{display:inline-flex}

/* Charts */
.chart{width:100%;min-width:0}
.chart svg{display:block;max-width:100%;height:auto}
.chart text{font-family:var(--font-body);font-size:12px;fill:var(--muted)}
.chart .lab{fill:var(--ink);font-weight:600}
.chart .val{fill:var(--ink)}
.chart .val,.chart .zl,.chart .lab{paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.chart .tick{font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{stroke:var(--axis);stroke-width:1}
.chart .zero{stroke:var(--ink);stroke-width:1.5}
.chart .zl{fill:var(--ink);font-weight:600;font-size:11.5px}
.chart .c1{fill:var(--c1)}.chart .c1w{fill:var(--c1-wash)}
.chart .c2{fill:var(--c2)}.chart .c2w{fill:var(--c2-wash)}
.chart .cg{fill:var(--generic)}.chart .cgw{fill:var(--generic-bg)}
.chart .ring{stroke:var(--surface);stroke-width:2}
.chart .pbox{fill:none;stroke:var(--pending);stroke-width:1;stroke-dasharray:4 3}
.chart .ptxt{fill:var(--pending)}
.chart .hit{fill:transparent}
.chart g.row:hover .c1w,.chart g.row:focus .c1w{fill:var(--c1)}
.chart g.row{outline:none}
.lg{display:inline-flex;align-items:center;gap:5px}
.sw{display:inline-block;width:14px;height:8px;border-radius:2px}
.sw.c1{background:var(--c1)}.sw.c1w{background:var(--c1-wash)}.sw.c2{background:var(--c2)}.sw.c2w{background:var(--c2-wash)}.sw.cg{background:var(--generic)}
.sw.pb{background:transparent;border:1px dashed var(--pending)}
.chartnote{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.agentsel{margin-top:8px;font-size:13px;background:var(--surface-2);border-radius:8px;padding:7px 10px;min-height:2.6em}
.agentsel b{font-weight:600}

/* Typhoid schedule matrix */
.sched-wrap{overflow-x:auto}
table.sched{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.sched th,table.sched td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--grid)}
table.sched thead th{font-family:var(--font-mono);font-weight:500;font-size:10.5px;letter-spacing:.04em;color:var(--muted)}
table.sched tbody th{text-align:left;font-weight:600;font-size:12.5px;padding-left:0;line-height:1.25}
table.sched tbody th small{display:block;font-weight:400;color:var(--muted);font-size:11px}

.","copy":false},"tirs2025":{"short":"TIRS trial 2025","title":"Randomized Trial of Targeted Indoor Spraying to Prevent Aedes-Borne Diseases, NEJM 2025","url":"https://doi.org/10.1056/NEJMoa2501069","kind":"intl","note":"Mexico cluster trial: lower indoor vector density did not establish benefit for the primary clinical endpoint. Context and outcome matter.","copy":false},"brugiab2012":{"short":"Brugia antibody study 2012","title":"Duration of detection of anti-BmR1 IgG4 antibodies after MDA in Sarawak, Malaysia, Trop Biomed 2012","url":"https://pubmed.ncbi.nlm.nih.gov/22543621/","kind":"intl","note":"","copy":false},"bancrofti_history":{"short":"Malaysia filariasis study","title":"Detection of circulating antigens and parasite specific antibodies in filariasis, Malaysian study 1994","url":"https://pubmed.ncbi.nlm.nih.gov/7973943/","kind":"intl","note":"Historical evidence only. Acquisition location requires exposure history and programme investigation, not species alone.","copy":false},"who_lf2025":{"short":"WHO LF monitoring 2025","title":"WHO Monitoring and epidemiological assessment of MDA in the global programme to eliminate LF, second edition, 2025","url":"https://www.who.int/publications/i/item/9789240105959","kind":"intl","note":"Updates 2011 guidance, including epidemiological monitoring surveys and TAS. Malaysian adoption and local programme decisions must be confirmed.","copy":false},"consensus_vector":{"short":"Consensus evidence search","title":"Consensus dengue surveillance and outbreak-control research thread, 20 October 2026","url":"https://consensus.app/search/support-a-critical-update-of-an-on-the-go-malaysia/i44mYdssThyfVf6Bp9Uh_A/","kind":"intl","note":"Evidence discovery aid. Operational statements in this app cite local guidance or checked primary/official sources; automated confidence scores are not used.","copy":false}},"diseases":[{"id":"dengue","name":"Dengue","bm":"Demam denggi","group":"Vector-borne","kw":"denggi dhf dss aedes fogging ptp srt srulv lokaliti hotspot wabak terkawal wtk doci combi wolbachia akta 154 surveillance survelan AI HI BI CI PI HPI PCI CLI CPI ovitrap sticky SOI SOPI ADI MIR VDIM resistance kerintangan MgO bioassay larva pupa","quick":[["Notify","24 h phone + form","my"],["Register","Clinical + lab","my"],["Incubation","Usually 4-10 days","intl"],["Human to mosquito","During viraemia","intl"],["Outbreak trigger",">=2 confirmed; locality / 14 d","my"],["Control / closure","Separate assessments","my"]],"calc":{"ip":[4,10],"usual":null,"ipSt":"intl","ipSrc":"who_dengue","onset":"Fever onset","follow":"vector","end":"dengue"},"s":{"notify":[{"t":"Notify all suspected DF and DHF cases by phone to the nearest PKD within 24 hours of diagnosis, then send the notification form. Re-notify if DF becomes DHF. Inform the PKD of any later laboratory result.","st":"my","src":["cd2017"],"ref":"p.20"},{"t":"Keep suspected-case notification separate from programme registration/classification. Record onset, diagnosis, notification receipt and registration independently; update laboratory and severity information. Do not treat isolated IgG as sufficient evidence of acute dengue.","src":["dengueplan","dengue_cpg4"],"ref":"Plan 2.1.1; CPG chapters 6-7","st":"my"},{"t":"Targets: 100% notified within 24 h of diagnosis (A3). 100% of lab-confirmed cases registered within 24 h of receiving the notification (B1). 85% registered within 3 days of onset (A4).","st":"my","src":["dengueplan"],"ref":"Jadual 7-8"},{"t":"Dengue death: register in eDengueV2 within 3 days of the date of death; register in eNotifikasi at once if not yet done.","st":"my","src":["dengueplan"],"ref":"2.1.2"}],"casedef":[{"t":"Use clinical classification: dengue without warning signs, with warning signs, or severe dengue. Assess fever phase and clinical state; defervescence can coincide with deterioration. Surveillance coding must not replace clinical triage.","src":["dengue_cpg4","dengue_cpg2015"],"ref":"clinical features / classification","st":"my"},{"t":"Warning signs include significant abdominal pain/tenderness, persistent vomiting, fluid accumulation, mucosal bleeding, lethargy/restlessness, liver enlargement and rising haematocrit with falling platelets. Shock, severe bleeding, respiratory distress or major organ involvement require urgent hospital assessment.","src":["dengue_cpg4","dengue_cpg2015"],"ref":"warning signs / severe dengue","st":"my"},{"t":"Select tests by illness day, clinical context and vaccination history. The supplied fourth edition recommends combined NS1/IgM/IgG RDT as first-line adult testing. Early negative testing does not exclude dengue; arrange clinical reassessment and appropriate repeat/reference testing.","src":["dengue_cpg4"],"ref":"chapter 7, pp.18-21","st":"my"},{"t":"A single IgG result can reflect past infection and is not recommended to diagnose acute dengue. Rapid IgG alone does not quantify high titre or establish secondary dengue.","src":["dengue_cpg4"],"ref":"p.20","st":"my"},{"t":"Within 30 days after TAK-003/Qdenga: record vaccine date; the supplied CPG prefers RT-qPCR on serum collected within 5 days of onset. NS1 may be considered if PCR unavailable. IgM/IgG alone are not confirmatory; PCR or NS1 positivity may require specialist interpretation for vaccine-derived versus wild-type virus. Consider sequencing through the reference laboratory for severe/fatal cases, clusters or vaccine safety investigation.","src":["dengue_cpg4"],"ref":"section 7.3, p.21","st":"my"}],"params":[{"t":"Symptoms usually start 4-10 days after infection. Use this as an investigation interval, not an absolute exclusion of other plausible exposures.","src":["who_dengue"],"st":"intl","ref":""},{"t":"Human-to-mosquito infection can occur before symptoms and after fever resolves. Protect the ill person from mosquito bites; the period depends on viraemia and clinical course.","src":["who_dengue"],"st":"intl","ref":""},{"t":"Extrinsic incubation in Aedes is about 8-12 days at 25-28 C. Keep intrinsic incubation, mosquito development, and operational locality clocks distinct.","src":["who_dengue","dengueplan"],"st":"mixed","ref":""}],"triggers":[{"t":"PAKAT 2021 WT: two or more laboratory-confirmed dengue cases in one locality, notified in CDCIS/eNotifikasi within 14 days of the first notification. Verify locality linkage and the current technical definition.","src":["pakat2021"],"ref":"p.14","st":"my"},{"t":"PAKAT WTK: further laboratory-confirmed cases notified after 14 days of the outbreak. PAKAT hotspot: outbreak lasting >30 days from its start. The >44-day category in the strategic plan/Perak EI manual triggers additional monitoring; it is not an interchangeable hotspot definition.","src":["pakat2021","ei2026","dengueplan"],"ref":"PAKAT pp.22,30; EI p.1","st":"mixed","note":"Later controlling technical circular and eDengue status must be confirmed with the programme."},{"t":"Combine case notifications, onset trends, severe disease/deaths, serotype/genotype surveillance, spatial clustering, vector findings, weather, complaints and event reports. Do not wait for a larval-index threshold to investigate a case or act on a credible cluster.","src":["dengueplan","dengue_cpg4"],"ref":"Plan 4.5.9; supplied CPG chapter 6","st":"my"}],"first24":[{"t":"First assess clinical danger and facilitate urgent referral. Give clear return precautions, protect the ill person from mosquito bites and arrange review through the clinical team. Avoid aspirin/NSAIDs. Children, pregnancy, older people and comorbid illness need their own clinical pathway; this guide does not calculate IV fluids.","src":["dengue_cpg4","dengue_cpg2015"],"ref":"triage / clinical management","st":"my"},{"t":"One-case locality: search-and-destroy (PTP) within 200 m, start within 24 h, 100% done within 3 days of registration (D2). Thermal fogging (SRT) within 200 m, start within 24 h, at least 80% within 24 h (D3).","st":"my","src":["dengueplan"],"ref":"Jadual 8 D2-D3"},{"t":"Controlled outbreak (WT): PTP 200 m, start within 24 h, 100% within 3 days of the latest case's registration (D4). Space spray (SRT/SRULV) 200 m, at least 80% within 24 h of the latest case's registration (D5).","st":"my","src":["dengueplan"],"ref":"Jadual 8 D4-D5"},{"t":"Uncontrolled outbreak or hotspot (WTK): PTP 400 m, start within 24 h, 100% every 7 days until the outbreak ends (D6). Space spray 400 m, start within 24 h, at least 80% every 7 days until the outbreak ends (D7).","st":"my","src":["dengueplan"],"ref":"Jadual 8 D6-D7","note":"Jadual 4 gives D6 as \"at least 80% within 24 h of registration\". Confirm which applies."},{"t":"Space spraying within 5 days of the case's onset (85% coverage target).","st":"my","src":["dengueplan"],"ref":"3.3.1"},{"t":"Gotong-royong in outbreak localities within one week of the outbreak starting (A11, target 100%).","st":"my","src":["dengueplan"],"ref":"Jadual 7 A11"}],"control":[{"t":"Larviciding in every hotspot locality (A8, 100%). House Pupa Index target in outbreak localities: 0 (B8).","st":"my","src":["dengueplan"],"ref":"Jadual 7-8"},{"t":"Check fogging effectiveness with 48-hour ovitrap/sticky ovitrap in WTK and hotspot localities (A9, 50%). Hotspots lasting more than 44 days: 7-day sticky ovitrap (B9, 100%).","st":"my","src":["dengueplan"],"ref":"Jadual 7-8"},{"t":"Set up one new COMBI volunteer team in an outbreak locality per district each year (D15).","st":"my","src":["dengueplan"],"ref":"Jadual 8 D15"},{"t":"Enforce Act 154 through Operasi Gempur Aedes (OGA) with PBT, SWCorp, DOSH and CIDB.","st":"my","src":["dengueplan","act154"],"ref":"4.5.15"},{"t":"Prevention by priority locality. I: uncontrolled, hotspot, recurrent outbreak or death last year. II: controlled outbreak last year. III: one-case locality last year. IV: no cases last year.","st":"my","src":["dengueplan"],"ref":"3.3.5"},{"t":"High-burden districts may outsource PTP outside premises, space spraying, SRULV and larviciding to pest control operators; the PKD monitors their work.","st":"my","src":["dengueplan"],"ref":"2.5.3"},{"t":"Use the surveillance and control panels below for AI/HI, BI, CI, premises/pupal measures, ovitraps, adult trapping, VDIM, resistance and post-SRT checks. Report numerator, denominator, coverage and elapsed time since control together.","src":["ei2026","srt_perak"],"ref":"EI pp.1-5; KKB method slides","st":"state"},{"t":"Target the most productive containers and the places where adults rest. Resolve water storage, waste, vacant premises and construction-site hazards with the responsible agency; review closed/refusing premises and actual coverage. Pair source reduction, appropriate larval/adult control and community action.","src":["ei2026","construction2015","pakat2021"],"ref":"EI pp.4-5; site control sections","st":"mixed"}],"legal":[{"t":"Use Act 154 and applicable orders through authorised officers for vector-breeding control. The supplied reprint incorporates amendments only to 1 January 2006: verify current text, delegation, notice/service and evidence requirements before enforcement.","src":["act154_scan","dengueplan"],"ref":"Act 154 sections 5-8,11,13; Plan 4.5.15","st":"law"}],"status":[{"t":"DOCI evaluates localities controlled within 14 days from registration of the second case. This control indicator is distinct from declaring an outbreak over.","src":["dengueplan"],"st":"my","ref":"3.3.4; Jadual 7"},{"t":"For a final closure decision, check the current technical locality rule, latest eligible case, continuing transmission, completed activities, and the district/JKN assessment. The strategic plan alone does not establish every closure/hotspot definition.","src":["dengueplan"],"st":"generic","ref":""}],"reporting":[{"t":"Report activity indicators to CPRC: daily for WTK/hotspot control (D6-D7), weekly for larviciding (A8) and sticky ovitrap (B9).","st":"my","src":["dengueplan"],"ref":"Annex 4"},{"t":"Record outbreak management and control activities in eDengueV2 and SPWD (the GIS outbreak management system).","st":"my","src":["dengueplan"],"ref":"2.1.2, 2.5.1"},{"t":"The district Dengue Outbreak Action Committee sets the order of field visits to outbreak localities.","st":"my","src":["dengueplan"],"ref":"2.6.3"},{"t":"Submit the weekly EI return from UEP PKD to CEP JKN Perak, then CPBV/SEP channels. Link case, locality, vector and action data by area and time. Capture pending laboratory results, failed or inaccessible sites, corrective owner and next review date.","src":["ei2026"],"ref":"p.1","st":"state"},{"t":"DVSS and flavivirus sentinel specimen targets in POA apply to designated sites and weeks. They are not quotas for every dengue case or evidence that a locality is free of transmission.","src":["poa_vector"],"ref":"sentinel indicators","st":"state"}]},"ns":"24 h","immediate":["First assess clinical danger and facilitate urgent referral. Give clear return precautions, protect the ill person from mosquito bites and arrange review through the clinical team. Avoid aspirin/NSAIDs. Children, pregnancy, older people and comorbid illness need their own clinical pathway; this guide does not calculate IV fluids.","One-case locality: search-and-destroy (PTP) within 200 m, start within 24 h, 100% done within 3 days of registration (D2). Thermal fogging (SRT) within 200 m, start within 24 h, at least 80% within 24 h (D3).","Controlled outbreak (WT): PTP 200 m, start within 24 h, 100% within 3 days of the latest case's registration (D4). Space spray (SRT/SRULV) 200 m, at least 80% within 24 h of the latest case's registration (D5)."],"checks":["Clinical danger, referral and return precautions addressed","Onset, diagnosis, notification and registration anchors checked","Cases, severe disease/deaths and lab trend mapped to locality","PTP / adult control radius, target premises and actual coverage recorded","EI timing, species, stage and sampling effort recorded","Ovitrap valid recovery and interval checked; missing traps recorded","Post-SRT droplet / trap / bioassay findings reviewed together","Productive containers, refusal/closed premises and agency actions addressed","Corrective actions, responsible person and review date recorded","eDengue / EI / POA reporting and formal status decision reconciled"],"reviewNote":"Expanded surveillance and kawalan wabak guide below. Perak 2026 action targets are method-specific. PAKAT hotspot >30 days and >44-day enhanced monitoring are distinct; confirm the current technical status rule."},{"id":"malaria","name":"Malaria (human species)","bm":"Malaria manusia: Pf / Pv / Pm","group":"Vector-borne","kw":"malaria knowlesi plasmodium falciparum vivax malariae bfmp anopheles irs itn llin foci re-introduction indigenous introduced imported gametosit bilik gerakan vekpro myfoci acd","quick":[["Notify","24 h; form within 7 d","my"],["Register","Lab-confirmed only","my"],["Incubation","Pf 10-14  /  Pv 12-18  /  Pm 30-45 d","my"],["Infectious","Via Anopheles","generic"],["Outbreak when","1 indigenous case","my"],["Closure","Resolve 1 / 2-cycle rule","partial"]],"calc":{"species":true,"ipSt":"my","ipSrc":"malwabak","onset":"Symptom onset","follow":"vector","end":"malaria"},"s":{"notify":[{"t":"Notify only laboratory-confirmed cases (BFMP).","st":"my","src":["cd2017"],"ref":"p.47"},{"t":"Notify within 24 hours to the nearest health office for early investigation; submit the notification form to the PKD within 7 days of confirmed diagnosis.","st":"my","src":["cd2017"],"ref":"p.47","note":"The section cites a \"Communicable Diseases Control Act 1988\". The correct Act is Act 342."},{"t":"Investigate within 24 hours and register the case within 24 hours. Report the outbreak at once to the state vector officer by SMS or WhatsApp.","st":"my","src":["malwabak"],"ref":"3.7 p.7; Lampiran 3 p.13"}],"casedef":[{"t":"Clinical: variable; most patients have fever, often with headache, back pain, chills, sweating, myalgia, nausea, vomiting, diarrhoea, anaemia or splenomegaly.","st":"my","src":["cd2017"],"ref":"p.46"},{"t":"Laboratory: BFMP (thick and thin film; the gold standard), PCR or RDT.","st":"my","src":["cd2017"],"ref":"p.46"},{"t":"The response depends on the case's origin: indigenous, introduced or imported. Malaria re-introduction means indigenous transmission in a locality with no indigenous human malaria for at least 3 consecutive years.","st":"my","src":["malre","malwabak"],"ref":"GP Re-intro p.1, p.4"},{"t":"These older human-malaria categories must not be used for P. knowlesi. The 2025 knowlesi guideline has separate suspected, probable, confirmed and cluster definitions.","src":["knowlesi"],"st":"my","ref":""}],"params":[{"t":"Incubation: <i>P. falciparum<\/i> 10-14 days; <i>P. vivax<\/i> 12-18 days; <i>P. malariae<\/i> 30-45 days.","st":"my","src":["malwabak"],"ref":"3.5, p.5"},{"t":"Peak biting of primary vectors in Peninsular Malaysia: <i>An. maculatus<\/i>, <i>An. campestris<\/i> and <i>An. letifer<\/i> 21:00-22:00; <i>An. sundaicus<\/i> on the coast 23:00-24:00. Local times vary.","st":"my","src":["malvc"],"ref":"Appendix 1, p.48"},{"t":"Older human-malaria planning cycles are Pf 56 days, Pv 64 days and Pm 120 days. The 2016 source uses inconsistent one/two-cycle language for closure; these values are not an automatic declaration rule.","src":["malwabak"],"st":"partial","ref":""}],"triggers":[{"t":"Emergency: one imported case with gametocytes, or one introduced case, in a locality.","st":"my","src":["malwabak"],"ref":"3.5, p.5"},{"t":"Outbreak: one indigenous case in a locality. The PKD declares the outbreak.","st":"my","src":["malwabak"],"ref":"3.5 p.5; Lampiran 1 p.11","note":"The flowcharts (Lampiran 2-3) open the outbreak operations room for all three case types, not only indigenous cases."},{"t":"Foci classes drive the response: cleared-up, new potential, new active, residual non-active, residual active and endemic foci; pseudofoci where ecology cannot support transmission.","st":"my","src":["malre","malvc"],"ref":"GP Re-intro 3-4; VC Table 3"},{"t":"Early-warning signals: unusual rise against trend, late treatment, poorer slide quality or slower results, more asymptomatic or drug-resistant cases, migrants from endemic countries, land clearing, higher vector density, rainfall change.","st":"my","src":["malwabak"],"ref":"2.1, pp.2-3"}],"first24":[{"t":"Start the outbreak management plan within 24 hours of the indigenous case's notification and complete it within 7 days.","st":"my","src":["malwabak"],"ref":"3.4, p.5","note":"Lampiran 1 starts the clock at the positive BFMP result instead of notification."},{"t":"Activate the district outbreak operations room (CPRC daerah) on the District Health Officer's instruction and inform JKN and KKM. It runs 8 am-5 pm daily, longer if needed.","st":"my","src":["malwabak"],"ref":"3.6 p.5; 3.7 p.7"},{"t":"Update the spot map and locality baseline (geographical reconnaissance) within 24 hours.","st":"my","src":["malwabak"],"ref":"3.7, p.8"},{"t":"Contacts group I (shared risk activity with the case, or in the source locality during exposure): start at once, finish within 3 days. Group II (household and workplace contacts during incubation; 2 km radius if home or workplace is the source locality) and group III (contacts found through groups I-II): within 1 month. BFMP result within 48 hours.","st":"my","src":["malwabak"],"ref":"3.7, p.7"},{"t":"Rapid entomological assessment (peak biting time, Anopheles density, larval survey) within 3 days of the outbreak declaration.","st":"my","src":["malvc"],"ref":"Appendix 1, p.49"},{"t":"Alert all government and private health facilities, increase screening of patients with fever, and check drug stock and diagnostic capacity.","st":"my","src":["malwabak"],"ref":"3.7, p.9"}],"control":[{"t":"Arrange admission and species-specific treatment under the current malaria clinical pathway. Confirm the species and severity; treatment and relapse prevention depend on the parasite.","src":["malwabak","knowlesi"],"st":"my","ref":""},{"t":"Active case detection: weekly for 4 weeks, then monthly until 2 transmission cycles are complete. Targets: 90% of houses visited, 80% of residents seen, fever slides from at least 5% of residents seen; BFMP results within 24 hours.","st":"my","src":["malwabak"],"ref":"3.7, p.7"},{"t":"IRS or ITN/LLIN in an active focus: start and finish within 7 days of notification of an introduced or indigenous case (each operation within 5 days), then every 6 months for 6 cycles (3 years). Cleared foci with high or medium RV index: at least 2 cycles (1 year).","st":"my","src":["malvc","irsitn"],"ref":"1.8 p.18; 2.2-2.3 p.23; 3.2 p.33"},{"t":"Active focus with previous routine control: run a bioassay; if the last control was more than 3 months ago, repeat IRS fully; if less, top up IRS/ITN for new premises and residents.","st":"my","src":["malwabak"],"ref":"3.7, p.8"},{"t":"Wall or net bioassay 2 weeks after the first cycle. Entomological investigation within 1 week where none was done before: 2 km radius, 144 man-hours.","st":"my","src":["malvc","malwabak"],"ref":"VC 2.8.4; Pelan 3.7 p.8"},{"t":"Space spraying is supplementary only: in active foci or when a human case with gametocytes is reported, not in pseudofoci. It can be omitted if IRS/ITN is completed within 7 days and needs entomological evidence. Cover the whole locality or 200 m around the index house, whichever is larger, indoors and outdoors, for 3 consecutive nights at the local peak biting time.","st":"my","src":["malvc"],"ref":"1.7.2 p.18; Appendix 1 pp.48-49"},{"t":"Larviciding at potential breeding sites in active foci.","st":"my","src":["malvc"],"ref":"1.7.1, p.18"},{"t":"Reactive case detection in active foci: follow contacts for 2 years (<i>P. vivax<\/i>) or 1 year (other species).","st":"my","src":["malvc"],"ref":"Table 3, p.13","note":"The 2016 outbreak plan follows contacts monthly only until the transmission cycle ends (56-120 days). Confirm which applies."},{"t":"Coverage targets: IRS premises and population 90%; population protected by ITN/LLIN 95%; implementation coverage 100%. Mop up if IRS premises or ITN population coverage falls below 90%.","st":"my","src":["malvc"],"ref":"Table 5 pp.19-20; 2.2.2; 3.4.3"},{"t":"Health education within 1 week of activation, reaching at least 60% of the population. Weekly inter-agency district outbreak committee until the outbreak ends.","st":"my","src":["malwabak"],"ref":"3.7, p.9"}],"legal":[{"t":"<b>Act 154<\/b> Destruction of Disease-Bearing Insects Act 1975 covers disease-carrying insects.","st":"law","src":["act154"]}],"status":[{"t":"The older plan contains a one-cycle end statement and a two-cycle requirement elsewhere. Obtain the controlling programme interpretation and record the actual closure decision. Do not automatically choose one cycle for a declaration.","src":["malwabak"],"st":"partial","ref":""},{"t":"The six-week control target and continuing vector-control/RV-index assessment are separate from a formal end decision.","src":["malwabak","malvc"],"st":"my","ref":""}],"reporting":[{"t":"Initial report (Lampiran 4) to the Vector-Borne Disease Sector through JKN within 24 hours of the outbreak being reported.","st":"my","src":["malwabak"],"ref":"4 p.10; Lampiran 3"},{"t":"Daily report (Lampiran 5) for the previous day: to JKN before 12 noon and to KKM before 3 pm, until the outbreak ends.","st":"my","src":["malwabak"],"ref":"3.7 p.7; Lampiran 3 p.13"},{"t":"Final report (Lampiran 6) within 1 month of declaring the outbreak over, after review by the JKN Vector Unit.","st":"my","src":["malwabak"],"ref":"4, p.10"},{"t":"Enter IRS/ITN coverage in Vekpro Online within a week of the activity. Half-year plans go in from 15-31 December and 15-30 June. Update foci in MyFOCI whenever they change.","st":"my","src":["irsitn","malvc"],"ref":"Bahagian C 1 p.56; VC 1.11-1.12","note":"The 2022 data guide reports that the Vekpro IRS module did not work that year; paper return PEM:SEM101(2021) was used instead."}]},"ns":"24 h / form 7 d","immediate":["Start the outbreak management plan within 24 hours of the indigenous case's notification and complete it within 7 days.","Activate the district outbreak operations room (CPRC daerah) on the District Health Officer's instruction and inform JKN and KKM. It runs 8 am-5 pm daily, longer if needed.","Update the spot map and locality baseline (geographical reconnaissance) within 24 hours."],"checks":["Clinical danger and referral assessed","Case definition and key times recorded","Source/contact or co-exposure assessed","Specimen and receiving laboratory coordinated","Reporting and responsible lead recorded"],"reviewNote":"The 2016 one/two-cycle closure discrepancy remains. Use an agreed programme interpretation and actual closure declaration."},{"id":"filariasis","name":"Lymphatic filariasis","bm":"Filariasis limfatik / untut","group":"Vector-borne","kw":"filariasis untut elephantiasis limfedema Brugia Wuchereria bancrofti NBS rapid PEFLK PELFK MDA IDA DEC MMDP Mansonia","ns":"Investigate <=24 h","quick":[["Investigate","24 h from receipt","state"],["Register","48 h from confirmation","state"],["Exposure history","Often years; assess travel","state"],["Transmission","Mosquito-borne","state"],["Response","Investigate every positive","state"],["Follow-up","3-year programme review","my"]],"calc":{"end":"none","follow":"vector"},"s":{"notify":[{"t":"On receiving a suspected/positive filariasis report, alert the district vector programme and verify the notification route. Perak targets: start investigation within 24 h of receiving notification; register within 48 h of confirmation. Complete investigation within 7 days, with the starting anchor agreed locally.","src":["fila_case"],"ref":"slide 2","st":"state"},{"t":"Keep notification receipt, laboratory confirmation, registration, treatment and follow-up anchors separate. These operational targets do not define the statutory notification deadline.","src":["fila_case"],"ref":"slide 2","st":"generic"}],"casedef":[{"t":"The supplied programme slides accept microfilariae on NBS and a positive Brugia rapid test for their respective case pathway, including asymptomatic people. Confirm species and laboratory method with the reference service; clinical lymphoedema needs assessment for other causes.","src":["fila_case"],"ref":"slides 3-4","st":"state"},{"t":"Brugia Rapid detects antibody, not circulating microfilariae. A Sarawak study detected anti-BmR1 IgG4 for 1-2 years after microfilariae disappeared. Retain the programme pathway, but do not equate antibody positivity with proven current microfilaraemia or treatment failure.","src":["brugiab2012","fila_case"],"ref":"study abstract; slide 3","st":"mixed"},{"t":"Do not automatically assign imported W. bancrofti or local B. malayi from species alone. Assess long-term residence, migration/travel, previous treatment, co-exposures and laboratory certainty, then document programme classification. Historical Malaysian bancroftian infection has been reported.","src":["fila_case","bancrofti_history"],"ref":"slide 5 and historical study","st":"mixed"}],"params":[{"t":"Mosquito-borne infection can be long-standing and asymptomatic. Extend exposure and residence history over years as indicated. A short acute incubation window or a generic two-incubation-period outbreak clock is not appropriate.","src":["fila_case"],"ref":"slide 6","st":"state"},{"t":"Relevant local vectors and habitats vary by parasite ecology, including Mansonia, Anopheles or Culex in appropriate settings. Entomology identifies the vector and response; Aedes-specific indices/radii are not automatically transferable.","src":["fila_case","peflk2025"],"ref":"vector ecology / EI","st":"state"}],"triggers":[{"t":"Every confirmed or epidemiologically concerning result requires programme investigation. First distinguish individual case management, focal response, population MDA, survey interpretation and national elimination validation.","src":["fila_case","who_lf2025"],"ref":"case intervention; WHO 2025","st":"mixed"},{"t":"The supplied slide uses >1% NBS or 2% rapid-test positivity and mentions one MDA round. Denominator, survey design, threshold direction and the full MDA strategy are insufficiently specified for an automatic trigger. Discuss with JKN/PEFLK; do not start or stop MDA solely from this rule.","src":["fila_case","peflk2025","who_lf2025"],"ref":"slide 11; WHO 2025","st":"partial"}],"first24":[{"t":"Assess fever, acute painful inflammation, wound infection or other serious illness and arrange clinical review. Verify laboratory result and collect detailed residence, travel, treatment and co-exposure history.","src":["fila_case"],"ref":"slides 2-8","st":"state"},{"t":"Coordinate baseline NBS before treatment if screened by rapid test, as directed by the programme. Confirm species-appropriate sampling time/volume, slide method, laboratory QA and transport rather than assuming all parasites share one periodicity.","src":["fila_case"],"ref":"slides 4,11","st":"state"},{"t":"Identify co-exposed persons (level 1) and household/workplace contacts (level 2). For suspected local transmission the Perak slides describe nearest neighbours and sampled houses within 1 km, expanding if findings warrant. The programme must define the eligible population and sampling approach.","src":["fila_case"],"ref":"slide 11","st":"state"}],"control":[{"t":"Individual treatment reference in 2017: DEC total daily dose 6 mg/kg/day for 12 days plus albendazole 400 mg once on day 1, under DOT. This is a source summary for clinician/programme review, not an automated prescription. Check current regimen, pregnancy/breastfeeding/age eligibility, co-endemic infections, contraindications and drug access.","src":["fila2017"],"ref":"sections 2-3","st":"my"},{"t":"The supplied newer case slides also describe IDA. Do not substitute a one-day IDA regimen or a population MDA regimen for the 12-day individual regimen without the current authorised programme/prescriber decision.","src":["fila_case","fila2017"],"ref":"slide 7; regimen section 3","st":"partial"},{"t":"Vector intervention is EI-directed, not routine blanket Aedes fogging. Address the identified species and habitat, human exposure and any relevant reservoir/ecological issues with the programme.","src":["fila_case"],"ref":"slide 13","st":"state"},{"t":"MMDP: confirm the cause/stage of lymphoedema; teach daily skin/foot washing and careful drying, skin and wound care, suitable footwear and individually appropriate movement/elevation. Refer acute inflammatory/infective episodes promptly, and arrange specialist hydrocele or other morbidity care where indicated. Do not prescribe compression without clinical assessment.","src":["fila_case"],"ref":"MMDP / referral slides","st":"state"},{"t":"Train the patient and caregiver; document access, adherence, wounds, acute attacks, disability and psychosocial needs. Perak slides: caregiver review monthly, health-worker review every 6 months and MMDP reporting every 6 months.","src":["fila_case"],"ref":"slides headed Lawatan pemantauan / Pelaporan","st":"state"}],"legal":[{"t":"Use the applicable notification, investigation and vector-control powers through authorised officers and current instruments. Do not use a population treatment recommendation as a compulsory treatment order.","src":["act342","act154_scan"],"ref":"current authority required","st":"law"}],"status":[{"t":"2017 schedule: NBS every 6 months during years 1-2, then rapid antibody testing at the end of year 3. Agree the follow-up anchor and species-appropriate test with the programme; do not use Brugia-specific antibody testing to assess W. bancrofti. Persistent microfilariae at 6 months need investigation and clinician-directed retreatment; positives in years 2-3 need physician/FMS referral.","src":["fila2017"],"ref":"section 3","st":"my"},{"t":"A negative final test contributes to programme completion assessment; the app does not certify cure. Population elimination cannot be inferred from one negative case or an old 2025 goal. WHO 2025 updates EMS/TAS, MDA monitoring and surveillance; verify Malaysian adoption through PEFLK.","src":["fila2017","peflk2025","who_lf2025"],"ref":"programme completion and monitoring","st":"mixed"}],"reporting":[{"t":"Record case investigation, laboratory method/results, classification rationale, DOT/adverse events, contact screening denominator, entomology, follow-up due/results and MMDP actions in approved programme records. Keep personal identifiers out of this standalone reference/POA.","src":["fila_case","fila2017"],"ref":"programme reporting","st":"mixed"},{"t":"Use POA links for IU merah, IU hijau and six-monthly lymphoedema follow-up. Supplied historical counts remain dated source data, not a current district case dashboard.","src":["poa_vector","peflk2025"],"ref":"POA filariasis indicators","st":"state"}]},"immediate":["Assess fever, acute painful inflammation, wound infection or other serious illness and arrange clinical review. Verify laboratory result and collect detailed residence, travel, treatment and co-exposure history.","Coordinate baseline NBS before treatment if screened by rapid test, as directed by the programme. Confirm species-appropriate sampling time/volume, slide method, laboratory QA and transport rather than assuming all parasites share one periodicity.","Identify co-exposed persons (level 1) and household/workplace contacts (level 2). For suspected local transmission the Perak slides describe nearest neighbours and sampled houses within 1 km, expanding if findings warrant. The programme must define the eligible population and sampling approach."],"checks":["Notification, confirmation and investigation anchors recorded","Species, test method and long-term exposure history reviewed","Baseline NBS and clinical treatment referral coordinated","Contact/co-exposure screening population agreed","EI-directed action and MMDP needs assessed","DOT, adverse-event plan and follow-up anchor confirmed","NBS/rapid-test review dates and reporting owner recorded"],"reviewNote":"New module from supplied 2017 regimen and Perak programme material. Antibody positivity, acquisition location and MDA decisions require distinct interpretation; current regimen adoption remains a programme decision."},{"id":"hfmd","name":"Hand, foot and mouth disease","bm":"Penyakit tangan, kaki dan mulut (HFMD)","group":"Childcare & school settings","kw":"hfmd tangan kaki mulut taska tadika tabika enterovirus ev71 coxsackie penutupan premis tutup 10 hari cdcis","quick":[["Notify","24 h","my"],["Register","Clinical; lab not needed","my"],["Incubation","3-6 days","intl"],["Spread","Respiratory / faecal / contact","mixed"],["Outbreak when",">=2 cases, one locality, 6 days","my"],["Closure review","Last onset + local criteria","my"]],"calc":{"ip":[3,6],"usual":null,"ipSt":"intl","ipSrc":"cdcybhfmd","onset":"Symptom onset","follow":"person","end":"conv","closure":10},"s":{"notify":[{"t":"Notify all suspected and confirmed cases within 24 hours of diagnosis, by notification form or the CDCIS e-Notification system. Laboratory confirmation is not required.","st":"my","src":["cd2017"],"ref":"p.31"}],"casedef":[{"t":"Clinical: any child aged 10 years or below with mouth or tongue ulcer AND maculopapular rash and/or vesicles on palms and soles, with or without fever.","st":"my","src":["cd2017"],"ref":"p.31"},{"t":"Laboratory: an enterovirus that causes HFMD (coxsackievirus A16, A5, A9, A10, B2, B5; EV71; others) isolated or detected from stool, vesicle fluid, mouth ulcer or saliva.","st":"my","src":["cd2017"],"ref":"p.31"},{"t":"Confirmed: a suspected case with laboratory confirmation, or one epidemiologically linked to a laboratory-confirmed case.","st":"my","src":["cd2017"],"ref":"p.31"}],"params":[{"t":"Incubation 3-6 days. The case definition uses 6 days as the incubation period for outbreaks.","st":"intl","src":["cdcybhfmd","cd2017"],"ref":"CD p.31"},{"t":"Spread by saliva and nose/throat secretions, blister fluid, faeces, and contaminated surfaces and objects.","st":"intl","src":["cdcybhfmd","cdchfmd"]},{"t":"Enteroviruses can be shed after clinical recovery. Return/exclusion decisions should follow the applicable institutional and clinical instruction, rather than a requirement to prove all shedding has ceased.","src":["hfmd2007"],"st":"my","ref":"2.1"}],"triggers":[{"t":"Outbreak: two or more cases in the same locality within the incubation period (6 days).","st":"my","src":["cd2017"],"ref":"p.31"},{"t":"Schools, preschools and taska in Johor report a cluster of 2 or more cases to the PKD.","st":"state","src":["johor2019"]}],"first24":[{"t":"Send specimens from 10% of cases (no more than 5 per outbreak) when the causative virus has not been confirmed in the same locality.","st":"my","src":["cd2017"],"ref":"p.32"},{"t":"At the school or taska: isolate children with symptoms and send them to a clinic or home; in an outbreak, screen at the entrance for fever and symptoms; clean and disinfect; brief staff and parents.","st":"state","src":["johor2019"]}],"control":[{"t":"The 2007 national guideline advises exclusion of affected children for at least ten days after symptom onset and medical assessment/certification before return. Check the applicable later district/JKN instruction for the child and setting.","src":["hfmd2007"],"st":"my","ref":"5.2.2; 6.4"},{"t":"The national source describes premises closure for ten days from the last case onset. A new case, the actual order, cleaning, and the reopening assessment can change the decision.","src":["hfmd2007"],"st":"my","ref":"5.2.2; 6.4"},{"t":"For primary schools the source describes assessment of the affected class. A taska, a classroom and an entire school require different decisions.","src":["hfmd2007"],"st":"my","ref":"6.4"},{"t":"Use soap and water, supervised cleaning, and a disinfectant effective against the relevant non-enveloped viruses. Follow the product concentration/contact time and local IPC instructions.","src":["hfmd2007","cdchfmd"],"st":"mixed","ref":""}],"legal":[{"t":"<b>s18(1)(d)<\/b> Closure of the premises until disinfected is the power used for taska and tadika closures.","st":"law","src":["act342","melaka2022"]}],"status":[{"t":"Assess child exclusion, premises order and outbreak status separately. The calculator shows the last-onset time criterion, followed by order review, cleaning and authorised reopening assessment.","src":["hfmd2007"],"st":"my","ref":"5.2.2; 6.4"}],"reporting":[{"t":"Maintain an institutional line list, exposed population, onset dates, laboratory status, cleaning record and communication with operators/parents. Complete outbreak documentation; the 2007 source requests a summary report within one month of the last case.","src":["hfmd2007"],"st":"my","ref":"6.5"},{"t":"Perak POA 2026 separately monitors 24-hour notification and registration within 72 hours. A performance target does not relax the case-notification action.","src":["poa_cdc"],"st":"state","ref":"H"}]},"ns":"24 h","immediate":["Send specimens from 10% of cases (no more than 5 per outbreak) when the causative virus has not been confirmed in the same locality.","At the school or taska: isolate children with symptoms and send them to a clinic or home; in an outbreak, screen at the entrance for fever and symptoms; clean and disinfect; brief staff and parents."],"checks":["Clinical danger and referral assessed","Case definition and key times recorded","Source/contact or co-exposure assessed","Specimen and receiving laboratory coordinated","Reporting and responsible lead recorded"]},{"id":"measles","name":"Measles","bm":"Campak","group":"Childcare & school settings","kw":"campak measles mmr pep immunoglobulin igm rash e-measles eliminasi genotype","quick":[["Notify","24 h","my"],["Register","Lab or epi-linked","my"],["Incubation","Rash 7-21 d (avg 14)","intl"],["Infectious","4 d before-4 d after rash","intl"],["Respond when","Every suspected case","state"],["Over when","Surveillance 42 d after last rash","intl"]],"calc":{"ip":[7,21],"usual":[14,14],"ipSt":"intl","ipSrc":"cdcpink","onset":"Rash onset","follow":"measles","end":"measles"},"s":{"notify":[{"t":"Notify all cases, suspected or confirmed, within 24 hours of diagnosis.","st":"my","src":["cd2017"],"ref":"p.48"},{"t":"Suspected cases notified through e-Notification flow into the e-Measles system for investigation and registration.","st":"my2","src":["mjmmeasles"]}],"casedef":[{"t":"Clinical: fever, and maculopapular (non-vesicular) rash, and cough or coryza or conjunctivitis.","st":"my","src":["cd2017"],"ref":"p.48"},{"t":"Laboratory: measles-specific IgM, or measles virus detected by culture or molecular methods.","st":"my","src":["cd2017"],"ref":"p.48"},{"t":"Suspected: anyone diagnosed as measles by a clinician. Confirmed: laboratory-confirmed, or meets the clinical definition and is epidemiologically linked to a laboratory-confirmed case.","st":"my","src":["cd2017"],"ref":"p.48"}],"params":[{"t":"Exposure to rash onset averages 14 days (range 7-21). Exposure to first symptoms averages 11-12 days.","st":"intl","src":["cdcpink"]},{"t":"Infectious from 4 days before to 4 days after rash onset.","st":"intl","src":["cdcpink","whomeasles"]},{"t":"Spread through the air and by secretions; the virus stays infectious in air or on surfaces for up to 2 hours.","st":"intl","src":["whomeasles"]}],"triggers":[{"t":"Act on every suspected case, including when measles is a differential diagnosis: notify, investigate, protect others and arrange specimens. Do not wait for a multi-case threshold before starting the case response.","src":["poa_cdc"],"st":"state","ref":"A.1.1"},{"t":"Use the Malaysian elimination-programme/JKN definition for formal outbreak classification. A US reporting threshold is not a Malaysian declaration rule.","src":["cd2017"],"st":"generic","ref":"p.48"}],"first24":[{"t":"Arrange airborne IPC and prompt clinical assessment. International context: isolate through four days after rash onset, with individual assessment for immunocompromised cases. Use the Malaysian programme/clinical release instruction.","st":"intl","src":["cdcsurv"]},{"t":"Perak POA 2026: serum in eligible suspected cases detected on rash days 1-28; serum plus throat swab/NPS/urine for PCR in eligible cases detected on rash days 1-5. Distinguish programme sampling indicators from clinical testing decisions and coordinate with the laboratory.","src":["poa_cdc"],"st":"state","ref":"A.1.2"},{"t":"Susceptible contacts: MMR within 72 hours of first exposure may give some protection; immune globulin within 6 days.","st":"intl","src":["cdcsurv"]},{"t":"In an outbreak, take serum from 10% of cases or at least 10 cases, whichever is fewer, plus specimens for virus isolation and genotyping. Genotype records are a verification criterion for elimination.","st":"my","src":["cd2017"],"ref":"p.48","note":"Older 2017 outbreak sampling statement. Coordinate the current elimination-programme strategy; do not use this fraction to omit sampling that is indicated for an eligible suspected case under the current programme."}],"control":[{"t":"Susceptible health care workers: exclude from day 5 after first exposure to day 21 after last exposure.","st":"intl","src":["cdcsurv"]},{"t":"Exempted or unvaccinated people without timely prophylaxis: exclude from the affected setting until 21 days after rash onset in the last case.","st":"intl","src":["cdcsurv"]},{"t":"Vaccination is used during outbreaks to stop spread.","st":"intl","src":["whomeasles"]},{"t":"Malaysian contact management and outbreak response immunisation: extract from MOH guidance.","st":"pending","src":[]}],"legal":[],"status":[{"t":"Keep active surveillance until at least two incubation periods (42 days) after rash onset in the last case.","st":"intl","src":["cdcsurv"]},{"t":"Malaysian rule for closing a measles outbreak: extract from MOH guidance.","st":"pending","src":[]}],"reporting":[{"t":"Record rash onset, diagnosis, notification, receipt, specimens and final classification. Perak monitors completion of classification within 60 days of registration and eWabak reporting for clusters/outbreaks.","src":["poa_cdc","poa_surv"],"st":"state","ref":"A.1.4; 3.1.1"}]},"ns":"24 h","immediate":["Arrange airborne IPC and prompt clinical assessment. International context: isolate through four days after rash onset, with individual assessment for immunocompromised cases. Use the Malaysian programme/clinical release instruction.","Perak POA 2026: serum in eligible suspected cases detected on rash days 1-28; serum plus throat swab/NPS/urine for PCR in eligible cases detected on rash days 1-5. Distinguish programme sampling indicators from clinical testing decisions and coordinate with the laboratory.","Susceptible contacts: MMR within 72 hours of first exposure may give some protection; immune globulin within 6 days."],"checks":["Clinical danger and referral assessed","Case definition and key times recorded","Source/contact or co-exposure assessed","Specimen and receiving laboratory coordinated","Reporting and responsible lead recorded"],"reviewNote":"Formal Malaysian outbreak classification and special PEP follow-up need programme/clinical assessment."},{"id":"food","name":"Food poisoning","bm":"Keracunan makanan","group":"Food & water-borne","kw":"keracunan makanan food poisoning fwbd kantin sekolah asrama majlis kenduri staphylococcus bacillus norovirus salmonella kimia racun","quick":[["Notify","24 h (case or episode)","my"],["Register","Clinical","my"],["Incubation","Depends on agent","intl"],["Infectious","Depends on agent","intl"],["Outbreak","At least 2, shared food/time","my"],["Closure","Source-control assessment","my"]],"calc":{"agent":true,"ipSt":"intl","ipSrc":"cdcfood","onset":"Onset","follow":"coexposed","end":"conv"},"s":{"notify":[{"t":"Notify every food poisoning case or episode to the nearest PKD within 24 hours of diagnosis. Laboratory confirmation is not required.","st":"my","src":["cd2017"],"ref":"p.28"}],"casedef":[{"t":"Clinical: acute onset of vomiting and/or diarrhoea and/or other acute symptoms after eating food (including drinks). Neurological symptoms such as paraesthesia, weakness and paralysis can occur.","st":"my","src":["cd2017"],"ref":"p.28"},{"t":"Laboratory: pathogen or toxin isolated, or a non-microbiological agent identified, from clinical specimens.","st":"my","src":["cd2017"],"ref":"p.28"},{"t":"Suspected: not applicable. Confirmed: any notified case that meets the clinical definition.","st":"my","src":["cd2017"],"ref":"p.28"}],"params":[{"t":"Incubation depends on the agent. Examples: <i>S. aureus<\/i> 30 min-8 h; <i>B. cereus<\/i> vomiting toxin 1-6 h; <i>C. perfringens<\/i> 6-24 h; norovirus 15-77 h. Full table in Tools  Exposure window.","st":"intl","src":["cdcfood"]}],"triggers":[{"t":"An episode/outbreak is two or more food-poisoning cases sharing a food source and exposure time. Laboratory confirmation is not needed for notification.","src":["fwbd4"],"st":"my","ref":"5.2"}],"first24":[{"t":"On the first call, preserve all implicated food, leftovers, containers and packaging for assessment. Verify the location, affected/exposed numbers, first onset, symptoms, meals, care sought and reporter details.","src":["fwbd4"],"st":"my","ref":"6.1-6.2"},{"t":"Notify by telephone within 24 hours, followed by the reporting system. Verify the event at the setting and activate the appropriate RAT/RRT and district coordination when outbreak criteria are met.","src":["fwbd4"],"st":"my","ref":"6.1-6.2"},{"t":"Arrange clinical, food, water, handler and environmental specimens according to the suspected agent and laboratory plan. The older specimen proportion is not a substitute for an outbreak-specific sampling strategy.","src":["fwbd4","cd2017"],"st":"my","ref":"6.3.2"},{"t":"Interview both ill and well exposed people. Capture every relevant meal, exact onset times, a denominator, and food-chain information before it is lost.","src":["fwbd4"],"st":"my","ref":"6.3.1"}],"control":[{"t":"Assess implicated premises, stop unsafe food preparation, preserve evidence and arrange sampling. Use the applicable authorised closure/cleaning instruction, handler assessment, food/water source control and follow-up inspection.","src":["fwbd4"],"st":"my","ref":"6.3-6.4"},{"t":"Combine clinical, epidemiological, laboratory, environmental and food-chain evidence. Incubation matching or one positive result alone does not establish the causal food.","src":["fwbd4"],"st":"my","ref":"6.3.1; 7.2"}],"legal":[{"t":"<b>s18(1)(d)<\/b> Close the implicated premises until disinfected.","st":"law","src":["act342"]}],"status":[{"t":"Review continuing exposure, new cases, active case detection and corrective actions with the outbreak lead. The guide does not apply a generic two-incubation-period declaration to every toxin or food-poisoning event.","src":["fwbd4","fwbd1"],"st":"generic","ref":""}],"reporting":[{"t":"SPOTREP/WhatsApp alert to JKN within four hours of receiving the outbreak notification; preliminary report to CPRC Negeri, CPRC KKM and FWBD within 24 hours.","src":["fwbd4"],"st":"my","ref":"7.1"},{"t":"Final report FWBD/002/KRM/Akhir/2025 within one month after the outbreak ends. Integrate epidemiology, environment, laboratory and HACCP findings. IMRAD format is used if requested in the relevant circumstances.","src":["fwbd4"],"st":"my","ref":"7.2"}]},"ns":"24 h","immediate":["On the first call, preserve all implicated food, leftovers, containers and packaging for assessment. Verify the location, affected/exposed numbers, first onset, symptoms, meals, care sought and reporter details.","Notify by telephone within 24 hours, followed by the reporting system. Verify the event at the setting and activate the appropriate RAT/RRT and district coordination when outbreak criteria are met.","Arrange clinical, food, water, handler and environmental specimens according to the suspected agent and laboratory plan. The older specimen proportion is not a substitute for an outbreak-specific sampling strategy."],"checks":["Clinical danger and referral assessed","Case definition and key times recorded","Source/contact or co-exposure assessed","Specimen and receiving laboratory coordinated","Reporting and responsible lead recorded"]},{"id":"typhoid","name":"Typhoid and paratyphoid","bm":"Tifoid / paratifoid","group":"Food & water-borne","kw":"tifoid typhoid paratifoid paratyphoid salmonella typhi paratyphi java d-tartrate carrier pembawa pengendali makanan food handler stool clearance typhidot igm pcr pfge mka ipoh mkak fosim kmam bakas ty21a vi tcv kenduri","quick":[["Notify","ASAP, within 7 d","my"],["Register","Lab-confirmed (CD 2017)","my"],["Incubation","Typhi 6-30 d  /  Paratyphi 1-10 d","my"],["Infectious","Typhi: from week 1, while shed","my"],["Outbreak when",">=2 cases in one incubation period","my"],["Over when","42 d after last onset","my"]],"calc":{"ip":[6,30],"usual":[7,21],"org":true,"ipSt":"my","ipSrc":"typ2025","onset":"Symptom onset","follow":"coexposed","end":"typhoid","exNote":"The guideline's interview covers the 7-21 days before onset (6.2.1); the investigation form says 21 days. For paratyphoid, select Paratyphi.","fuNote":"The 2025 guideline sets no follow-up period for contacts. It asks for a stool sample from every contact and active case detection among everyone epidemiologically linked (6.2.2-6.2.3)."},"s":{"notify":[{"t":"Notify every suspected, probable and confirmed case of typhoid or paratyphoid to the nearest PKD as soon as possible, within 7 days.","st":"my","src":["typ2025"],"ref":"6.1, p.9","note":"The 2017 edition also asked for e-notification of suspected cases within 24 hours and immediate reporting of confirmed cases. The 2025 edition drops both, so a cluster can surface up to a week late."},{"t":"Case Definitions 2017 also gives 7 days, and registers laboratory-confirmed cases only.","st":"my","src":["cd2017"],"ref":"p.82"},{"t":"A case notified outside its home area is passed to the PKD where the case lives; that district investigates.","st":"my","src":["typ2025"],"ref":"6.2.1, p.10"},{"t":"Hospitals phone the health office at discharge and send the stool clearance note (Lampiran 4). Deaths are reported to the PKD for audit.","st":"my","src":["typ2025"],"ref":"5.4, 5.6, pp.8-9"}],"casedef":[{"t":"Clinical: prolonged high fever, headache, malaise, diarrhoea or constipation, poor appetite, enlarged liver and spleen, rose spots on the chest, abdomen and back.","st":"my","src":["typ2025"],"ref":"4.1.1, p.3"},{"t":"Laboratory: <i>S.<\/i> Typhi or Paratyphi isolated from blood, stool or another clinical sample, or a positive PCR. If <i>S.<\/i> Paratyphi B is isolated, request d-tartrate testing to identify biovar java, which is zoonotic.","st":"my","src":["typ2025"],"ref":"4.1.2, p.3"},{"t":"Suspected: meets the clinical criteria. Probable: suspected case with positive IgM serology. Confirmed: suspected case confirmed by culture or PCR.","st":"my","src":["typ2025"],"ref":"4.2.1-4.2.3, p.4","note":"The guideline does not say whether probable (IgM-only) cases count towards the outbreak definition. Agree this with JKN before declaring an outbreak on serology alone."},{"t":"Relapse: symptoms with a positive culture or PCR within 3 months of completed treatment and negative stool cultures. Up to 10% of patients relapse, usually 1-3 weeks after recovery. Reinfection: the same after 3 months.","st":"my","src":["typ2025"],"ref":"4.2.4-4.2.5, p.4"},{"t":"Carrier: <i>S.<\/i> Typhi or Paratyphi in stool without symptoms, including a treated case still stool-positive more than 3 months after treatment. Chronic carrier: shedding for 12 months or more (1-4% of treated patients). Detect by culture or PCR. Paratyphoid carriage is uncommon.","st":"my","src":["typ2025"],"ref":"4.4, p.5"},{"t":"Contact: anyone exposed to a confirmed case or a contaminated environment, especially household members, food handlers and people who shared food or drink with the case.","st":"my","src":["typ2025"],"ref":"4.3, p.4"}],"params":[{"t":"<i>S.<\/i> Typhi: incubation 6-30 days, average 7-21. Infectious from the first week after onset for as long as bacteria are shed in faeces. Humans are the only host.","st":"my","src":["typ2025"],"ref":"3.0 Jadual 2, p.3","note":"The 2017 edition gave 3 days to 1 month, average 8-14 days."},{"t":"<i>S.<\/i> Paratyphi A, B and C: incubation 1-10 days; infectious for 1-2 weeks. Paratyphi B biovar java and Paratyphi C can also have animal hosts (biovar java: chickens, cattle, turtles, tropical fish).","st":"my","src":["typ2025"],"ref":"3.0 Jadual 2, p.3"},{"t":"Without proper treatment, mortality can reach 10-30%; early treatment brings it below 1%. Paratyphoid is milder.","st":"my","src":["typ2025"],"ref":"1.0, p.1"},{"t":"Malaysia 2014-2023: incidence below 1 per 100,000 a year. In 2023, 40% of cases were aged 18-40 and 30% aged 7-17; the highest rates were in Pulau Pinang (0.9), WP Kuala Lumpur (0.7) and Kelantan (0.5 per 100,000). Travel to South Asia and sub-Saharan Africa carries the highest risk.","st":"my","src":["typ2025"],"ref":"2.0, p.2"},{"t":"Every isolate needs antibiotic sensitivity testing. Extensively drug-resistant strains (resistant to ceftriaxone, ciprofloxacin, amoxicillin, chloramphenicol and co-trimoxazole) are treated with meropenem with an infectious disease physician.","st":"my","src":["typ2025"],"ref":"5.1.2, pp.6-7"}],"triggers":[{"t":"Outbreak: 2 or more cases within one incubation period in the same locality, or epidemiologically linked.","st":"my","src":["typ2025"],"ref":"4.5, p.5","note":"The section is headed \"Wabak tifoid\". It does not say which incubation period applies to paratyphoid (1-10 days) or whether probable cases count. With a typhoid incubation of up to 30 days, onsets up to 30 days apart can meet the definition."},{"t":"In an outbreak, send isolates for PFGE to link cases, contacts and sources: <i>S.<\/i> Typhi to IMR, <i>S.<\/i> Paratyphi to MKAK.","st":"my","src":["typ2025"],"ref":"6.2.5 Jadual 5, pp.13-15"},{"t":"Case Definitions 2017: in an outbreak, step up surveillance with active case finding and send food or water samples for <i>S.<\/i> Typhi/Paratyphi.","st":"my","src":["cd2017"],"ref":"p.82"}],"first24":[{"t":"Admit every confirmed typhoid case. Isolate suspected cases; admission is advised, depending on clinical assessment. Paratyphoid needs admission only for complications. Discharge at own risk (AOR) is not allowed.","st":"my","src":["typ2025"],"ref":"5.0, 5.4, pp.5, 8","note":"The 2017 edition admitted every suspected case."},{"t":"Paratyphoid is handled more lightly: no detailed investigation, stool clearance or follow-up unless the case could start an outbreak, for example a food handler. Paratyphi B biovar java causes gastroenteritis, has no known carriers and needs no stool clearance.","st":"my","src":["typ2025"],"ref":"5.0, 5.5, 6.2.1, 6.4.1, pp.5, 8-9, 23"},{"t":"Investigate every notified case on form FWBD/003/UMU/2025: onset, symptoms, treatment before admission, movements and food or drink in the 7-21 days before onset (travel, kenduri and gatherings, food premises, high-risk food), visitors with typhoid, anti-typhoid vaccination and a contact list. Get specimen dates, results and the case history from the hospital.","st":"my","src":["typ2025"],"ref":"6.2.1, pp.9-10","note":"The 7-21-day window misses the likely exposure days for paratyphoid (incubation 1-10 days) and the tail of typhoid (up to 30 days). Use Tools  Exposure window with the organism selected."},{"t":"Active case detection among everyone epidemiologically linked to the case. Trace all contacts on the same form and take fresh stool from each for <i>S.<\/i> Typhi/Paratyphi. Refer contacts with symptoms. Treat positive contacts with symptoms as cases and those without as carriers.","st":"my","src":["typ2025"],"ref":"6.2.2-6.2.3, p.10","note":"The 2017 Typhidot Carrier serology screen is no longer listed."},{"t":"Specimens: take stool before antibiotics. Stool in a sterile container must reach the laboratory within 2 hours at 2-8 deg C; in Cary-Blair it keeps 24 hours at room temperature or 48 hours at 2-8 deg C. Rectal swabs only for infants, but they are allowed at follow-up. Request sensitivity testing on every isolate.","st":"my","src":["typ2025"],"ref":"5.1.2, Jadual 5, Lampiran 3, pp.7, 12, 28"},{"t":"Laboratories: serotyping at MKAK or MKA Ipoh (northern zone). Validated stool PCR at MKAK, MKAKB, MKAI, MKAJB and MKAKK. PCR to find carriers is at MKAK, limited to food handlers, and requested after the public health physician discusses it with the pathologist.","st":"my","src":["typ2025"],"ref":"Jadual 5, pp.12-15; Lampiran 1-2"},{"t":"Food: leftover suspect food or high-risk proxy samples (250 g), kept at 0-4.4 deg C (frozen samples -18 to 0 deg C) and sent within 24 hours with Borang A from FOSIM to MKA and MKKM for <i>S.<\/i> Typhi PCR. Swab food handlers' hands, utensils and food-contact surfaces.","st":"my","src":["typ2025"],"ref":"Jadual 6-7, pp.16-17"},{"t":"Environment: inspect the case's home (hygiene, flies, cockroaches and rats, refuse, sewage). If food premises are suspected, including ice factories, inspect them with the Food Safety and Quality unit, trace raw materials and activate the RRT in an outbreak. If water is suspected, KMAM tests on site (pH, residual chlorine, turbidity, colour, dissolved oxygen, conductivity, TDS) plus total coliform and <i>E. coli<\/i>, sends bacteriology samples to Jabatan Kimia Malaysia and reviews 3 months of water-quality records before onset.","st":"my","src":["typ2025"],"ref":"6.2.4, pp.10-11"}],"control":[{"t":"Step up inspection of food premises in the outbreak area and disinfect premises suspected as the source. Close food premises that breach Act 342, the Food Act 1983, the Food Regulations 1985 or the Food Hygiene Regulations 2009.","st":"my","src":["typ2025"],"ref":"6.3.1, p.18"},{"t":"Water
